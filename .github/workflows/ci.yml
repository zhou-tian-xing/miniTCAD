name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Baseline run and three-file acceptance
        run: |
          python -m minitcad.cli solve examples/pn_baseline_0_to_030.yaml --out runs/ci
          python scripts/accept_outputs.py runs/ci
      - name: Mesh convergence table (T12)
        run: python scripts/run_mesh_convergence.py

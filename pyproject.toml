[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minitcad"
version = "0.1.0"
description = "1D silicon Poisson-Drift-Diffusion course project (8 weeks, 2 owners)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# GUI 是可选依赖：核心模块不得无条件导入 Qt（第 14.9 节）。
dev = ["pytest>=7.0", "matplotlib>=3.7"]
gui = ["PySide6>=6.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
